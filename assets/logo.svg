<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <style>
    .bg { fill: #ffffff; rx: 16px; stroke: #e2e8f0; stroke-width: 2px; }
    .letter { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; font-size: 52px; fill: #000000; }
  </style>
  
  <!-- White background box with subtle border -->
  <rect width="100" height="100" class="bg" />
  
  <!-- Initials BE (Both Black) -->
  <text x="14" y="68" class="letter">B</text>
  <text x="50" y="68" class="letter">E</text>
</svg>